name: sync

on:
  # Re-enabled 2026-06-06: GH Actions is the primary scheduler again
  # (Skyvia Control Flow abandoned Jun 2). Chain validated end-to-end Jun 5:
  # step-6 incremental (POST_DAT 30-day window) + "Use cache" off on the
  # Deals lookups in step-6/7 resolved the HubSpot internal rate limit.
  # Start the chain at 6 PM ET: after the client's 6 PM data-entry cutoff and
  # well before the NetOps 12 AM-5 AM patching window that was dropping the
  # CounterPoint connection overnight (confirmed Jun 2026 w/ NetOps). The
  # ~5.5h chain then finishes ~11:30 PM ET, clear of patching.
  # GitHub's schedule drift is large AND variable (~2h on the Jun 23 evening
  # run, ~5h on the morning runs), so the cron alone cannot hit 6 PM. Instead
  # the cron fires early (drifts to ~1-6 PM ET) and the 'gate' job below HOLDS
  # until exactly 6 PM ET (DST-aware) before the chain begins, making the
  # start independent of the drift. 17:00 UTC keeps the fire <= 6 PM ET even
  # at ~5h drift, so the gate always waits forward, never starts late.
  schedule:
    - cron: '0 17 * * 1-5'  # fires ~1-6 PM ET (drift); gate holds to 6 PM ET
  workflow_dispatch:

env:
  API_TOKEN: ${{ secrets.API_TOKEN }}
  WORKSPACE: ${{ secrets.WORKSPACE }}
  CHAIN_JSON: ${{ secrets.CHAIN_JSON }}

jobs:
  # Gate: GitHub fires the schedule with variable drift (~1-6 PM ET). This job
  # holds until exactly 6 PM America/New_York (DST-aware), then releases the
  # chain, so the sync always starts at 6 PM ET regardless of when GitHub
  # actually triggered the workflow. Idle wait is ~0-5h on a cheap runner.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Hold until 6 PM Eastern
        run: |
          TARGET=$(date -u -d 'TZ="America/New_York" 18:00' +%s)
          NOW=$(date -u +%s)
          if [ "$NOW" -lt "$TARGET" ]; then
            echo "Holding $(( (TARGET-NOW)/60 )) min until 6 PM ET ($(date -u -d "@$TARGET") UTC)"
            sleep $((TARGET - NOW))
          else
            echo "Already at/past 6 PM ET ($(date -u) UTC); starting now"
          fi

  step-1:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python orchestrator.py --job step-1

  step-2:
    needs: step-1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python orchestrator.py --job step-2

  step-3:
    needs: step-2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python orchestrator.py --job step-3

  step-4:
    needs: step-3
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python orchestrator.py --job step-4

  step-5:
    needs: step-4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python orchestrator.py --job step-5

  # step-5b: Data Flow "Deals - Open Orders Insert-Update (Stage Lock)".
  # Creates new open-order deals at PO/Order Created; updates fields on
  # existing deals WITHOUT touching dealstage (manual stage moves persist).
  # Replaces the open-orders half of the old step-5 Import (now cancelled-only).
  step-5b:
    needs: step-5
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python orchestrator.py --job step-5b

  step-6:
    needs: step-5b
    runs-on: ubuntu-latest
    timeout-minutes: 350  # GitHub-hosted runner hard cap is 360 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python orchestrator.py --job step-6

  step-7:
    # Run regardless of step-6 result, as long as step-5 succeeded.
    # step-7 is independent of step-6 in source-system terms.
    #
    # 15-min buffer before triggering Skyvia: step-6's high-volume Line Items
    # upsert (~39K rows) bursts HubSpot's 15K-reads-per-5-seconds CRM API
    # limit at the portal level. Even after step-6 completes, immediately
    # firing step-7 (which also bursts reads against the same portal) can
    # collide with the still-recovering budget and fail with the same
    # rate-limit error. The 15-min delay gives HubSpot's portal-wide budget
    # full time to clear before step-7's burst.
    needs: [step-5, step-6]
    if: ${{ always() && needs.step-5.result == 'success' }}
    runs-on: ubuntu-latest
    # 180 (was 135): the Skyvia run itself takes ~114 min and, with the 15-min
    # pre-sleep plus polling-detection lag, the job was landing right at the old
    # 135 cap (Jun 15 finished at 131.5 min; Jun 16 hit 135 and GitHub cancelled
    # the job even though Skyvia had already completed the sync server-side).
    # 180 gives ~50 min headroom; runner hard cap is 360.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Wait for HubSpot rate-limit budget to clear after step-6 burst
        run: sleep 900
      - run: python orchestrator.py --job step-7
