name: sync

on:
  # Scheduled runs disabled 2026-05-20: Skyvia Control Flow now owns the
  # nightly chain. This workflow remains as a manual fallback only.
  # To re-enable: uncomment the schedule block below.
  # schedule:
  #   - cron: '0 2 * * 1-5'  # Sun-Thu 22:00 ET = Mon-Fri 02:00 UTC
  workflow_dispatch:

env:
  API_TOKEN: ${{ secrets.API_TOKEN }}
  WORKSPACE: ${{ secrets.WORKSPACE }}
  CHAIN_JSON: ${{ secrets.CHAIN_JSON }}

jobs:
  step-1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python orchestrator.py --job step-1

  step-2:
    needs: step-1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python orchestrator.py --job step-2

  step-3:
    needs: step-2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python orchestrator.py --job step-3

  step-4:
    needs: step-3
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python orchestrator.py --job step-4

  step-5:
    needs: step-4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python orchestrator.py --job step-5

  step-6:
    needs: step-5
    runs-on: ubuntu-latest
    timeout-minutes: 350  # GitHub-hosted runner hard cap is 360 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python orchestrator.py --job step-6

  step-7:
    # Run regardless of step-6 result, as long as step-5 succeeded.
    # step-7 is independent of step-6 in source-system terms.
    #
    # 15-min buffer before triggering Skyvia: step-6's high-volume Line Items
    # upsert (~39K rows) bursts HubSpot's 15K-reads-per-5-seconds CRM API
    # limit at the portal level. Even after step-6 completes, immediately
    # firing step-7 (which also bursts reads against the same portal) can
    # collide with the still-recovering budget and fail with the same
    # rate-limit error. The 15-min delay gives HubSpot's portal-wide budget
    # full time to clear before step-7's burst.
    needs: [step-5, step-6]
    if: ${{ always() && needs.step-5.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Wait for HubSpot rate-limit budget to clear after step-6 burst
        run: sleep 900
      - run: python orchestrator.py --job step-7
